        <style>
            body {
                font-family: Georgia, "Times New Roman", serif;
            }
        </style>
        <style>
            h1 {
                font-size: 40px;
                font: Georgia, "Times New Roman", serif;
            }

            body {
             font-family: Georgia, "Times New Roman", serif;
             text-align: center;
             font-size: 20px;
              } 

            form {
                width:  400px;
                text-align: center;
            }

            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            input[type="number"],
            input[type="date"],
            select,
            textarea {
                width: 35%;
                padding: 10px;
                margin: 10px auto 40px auto;
                display: block;
                box-sizing: border-box;
                border: 1px solid #ccc;
                border-radius: 4px;
                text-align: center;
            }

            button {
                padding: 10px 20px;
                background-color: #4a1a1a;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            button:hover {
                background-color: #4a1a1a;
                color: white;
            }
        </style>
        <body>
            
            <nav class="navbar">
                <a href="index.html">Profil Mahasiswa</a>

        <div class="tabel-wrapper">
            <!-- Formulir Pendaftaran -->
            <h1>Formulir Pendaftaran</h1>

            <div class="hiasan">
                <span></span>
                ♡ ˚ ♡ ˚ ♡
                <span></span>
            </div>

            <div class="table-container">

            <!-- Nama -->
            <from>
            <!--Nama-->
            <br>
            <label>Nama Lengkap</label><br>
            <input placeholder="Masukkan nama" type="text">

            <!--Email-->
            <br><br>
            <label>Email</label><br>
            <input placeholder="nama@gmail.com" type="email">

            <!--Password-->
            <br><br>
            <label>Password</label><br>
            <input placeholder="******" type="password">

            <!--Umur-->
            <br><br>
            <label>Umur</label><br>
            <input placeholder="Tentukan umur" type="number">

            <!--Tanggal Lahir-->
            <br><br>
            <label>Tanggal Lahir</label><br>
            <input type="date">

            <!--Jenis Kelamin-->
            <br><br>
            <label>Jenis Kelamin</label><br>
            <input type="radio" name="gender" value="Laki-laki"> Laki-laki
            <input type="radio" name="gender" value="Perempuan"> Perempuan

            <!--Hobi-->
            <br><br>
            <label>Hobi</label><br>
            <input type="checkbox" name="hobi" value="Coding"> Coding
            <input type="checkbox" name="hobi" value="Gaming"> Gaming
            <input type="checkbox" name="hobi" value="Olahraga"> Olahraga

            <!--Jurusan-->
            <br><br>
            <label>Jurusan</label><br>
            <select placeholder="-- Jurusan --" name="jurusan">
                <option>--Pilih Jurusan--</option>
                <option value="Sistem Informasi">Sistem Informasi</option>
                <option value="Teknik Informatika">Teknik Informatika</option>
                <option value="Teknik Komputer dan Jaringan">Teknik Komputer dan Jaringan</option>
            </select>

            <!--Alamat-->
            <br><br>
            <label>Alamat</label><br>
            <textarea placeholder="Masukkan alamat" name="alamat" rows="4" cols="50"></textarea>

            <!--Foto-->
            <br><br>
            <label>Foto</label><br>
            <input type="file" name="foto">

            <!--Website-->
            <br><br>
            <label>Website</label><br>
            <input placeholder="https://www.example.com" type="url">

            <!--Tombol Kirim dan Reset-->
            <br><br>
            <button type="submit">Kirim</button>
            <button type="reset">Reset</button>
            </from>
        </div>   

        <div class="container">
            <hr class="garis-bawah">
        </div>
        </div>
